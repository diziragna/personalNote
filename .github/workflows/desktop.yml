name: Desktop app

# Builds the Windows and Ubuntu installers. Run it from the Actions tab, or push a tag like desktop-v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 keeps the .deb and AppImage working on 22.04 and newer.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Build installers
        working-directory: desktop
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: daynote-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
